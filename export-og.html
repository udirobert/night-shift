<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NIGHT SHIFT — social card (1200×630)</title>
<style>
  /* the link-preview card: same recipe as export-cover-painted.html —
     art/cover-base.webp full-bleed, the game's paper type over it —
     cropped to the 1200×630 og:image frame. */
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0b0f;
    display: grid; place-items: center;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  .cover {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #0d0f14;
  }
  .cover img.base {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 46%; display: block;
  }
  .cover::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(120% 100% at 50% 20%, transparent 24%, rgba(9,10,14,.66) 100%),
      linear-gradient(rgba(9,10,14,.34) 0%, rgba(9,10,14,.5) 58%, rgba(9,10,14,.78) 100%);
  }
  .lockup {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; color: #ece5d8;
  }
  .kicker {
    margin-top: 58px;
    font-family: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    font-size: 21px; letter-spacing: .24em; text-transform: uppercase;
    color: #e8b34b;
  }
  h1 {
    margin: 12px 0 0; font-size: 118px; font-weight: 600; letter-spacing: .05em;
    line-height: 1; text-shadow: 0 4px 26px rgba(0,0,0,.9);
  }
  .rule-line {
    width: 96px; height: 0; border-top: 3px solid #e8b34b; margin: 24px 0 20px;
  }
  .tagline {
    font-family: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    font-size: 22px; letter-spacing: .12em; color: #c9c2b2;
    line-height: 1.8; text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }
  .stamp {
    position: absolute; right: 44px; bottom: 34px; z-index: 2;
    font-family: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    font-size: 26px; font-weight: bold; letter-spacing: .18em;
    color: #d08c86;
    border: 4px solid #d08c86; border-radius: 6px;
    padding: 8px 16px;
    transform: rotate(-7deg);
    opacity: .92;
    text-shadow: 0 0 1px #d08c86;
    box-shadow: inset 0 0 8px rgba(208,140,134,.35);
  }
</style>
</head>
<body>
  <div class="cover" id="cover">
    <img class="base" src="art/cover-base.webp" alt="">
    <div class="lockup">
      <span class="kicker">a deduction thriller in five night shifts</span>
      <h1>NIGHT SHIFT</h1>
      <div class="rule-line"></div>
      <span class="tagline">You took the night job at the Register.<br>Nobody mentioned the machine.</span>
    </div>
    <span class="stamp">SUS</span>
  </div>
</body>
</html>
